<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Điểm Danh - THPT Vị Thanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-sky-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-sky-100">
                    <i class="ph ph-address-book"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">Tra Cứu Điểm Danh Học Sinh</h1>
                    <p class="text-xs text-slate-500">Trường THPT Vị Thanh — Trang tính: <span class="font-semibold text-sky-600">dulieu</span></p>
                </div>
            </div>

            <button onclick="fetchData(true)" class="inline-flex items-center justify-center gap-2 px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-xl transition-all shadow-sm">
                <i class="ph ph-arrows-clockwise text-base" id="reloadIcon"></i>
                <span>Tải lại dữ liệu</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">

        <!-- TIM KIEM VÀ LOC -->
        <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-6 shadow-sm flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass text-slate-400 text-lg absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Nhập tên hoặc mã học sinh..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all">
            </div>

            <div class="w-full sm:w-48">
                <select id="classFilter" onchange="applyFilters()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all">
                    <option value="">-- Tất cả các lớp --</option>
                </select>
            </div>

            <div class="w-full sm:w-48">
                <select id="statusFilter" onchange="applyFilters()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all">
                    <option value="">-- Tất cả trạng thái --</option>
                    <option value="Đúng giờ">Đúng giờ</option>
                    <option value="Trễ">Đi trễ</option>
                    <option value="P">Vắng có phép (P)</option>
                    <option value="KP">Vắng không phép (KP)</option>
                </select>
            </div>
        </div>

        <!-- BANG HIEN THI DANH SACH -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                            <th class="py-3.5 px-4 text-center w-16">STT</th>
                            <th class="py-3.5 px-4">Họ và Tên</th>
                            <th class="py-3.5 px-4 text-center">Lớp</th>
                            <th class="py-3.5 px-4 text-center">Mã HS</th>
                            <th class="py-3.5 px-4 text-center">Thời Gian Điểm Danh</th>
                            <th class="py-3.5 px-4 text-center">Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                </table>
            </div>

            <div id="loadingState" class="py-12 text-center hidden">
                <div class="inline-block w-7 h-7 border-3 border-sky-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-slate-500 text-sm mt-2">Đang đồng bộ dữ liệu mới nhất...</p>
            </div>

            <div id="emptyState" class="py-12 text-center hidden">
                <i class="ph ph-user-list text-4xl text-slate-300"></i>
                <p class="text-slate-500 text-sm mt-2">Không tìm thấy dữ liệu học sinh phù hợp.</p>
            </div>
        </div>
    </main>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyM394lmbkOpjRzGWUDGSLLzPIzvf-FE0fDbQsUmUxxAMuKdA1mIg2E-inscbIbNIWs7w/exec";
        const LOCAL_STORAGE_KEY = "FAST_STUDENT_CACHE_V1";
        
        let allStudents = [];
        let filteredStudents = [];

        function fetchData(isManualReload = false) {
            const reloadIcon = document.getElementById('reloadIcon');
            const loadingState = document.getElementById('loadingState');
            
            if (reloadIcon) reloadIcon.classList.add('animate-spin');

            // 1. HIỂN THỊ TỨC THÌ TỪ LOCALSTORAGE (CHƯA TỚI 0.1 GIÂY)
            const localData = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (localData && !isManualReload) {
                try {
                    const parsed = JSON.parse(localData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        allStudents = parsed;
                        populateClassDropdown();
                        applyFilters();
                    }
                } catch(e){}
            } else {
                if (loadingState) loadingState.classList.remove('hidden');
            }

            // 2. GỌI NGẦM GOOGLE SHEET ĐỂ CẬP NHẬT DỮ LIỆU MỚI
            const oldScript = document.getElementById('jsonp_script');
            if (oldScript) oldScript.remove();

            window.handleSheetData = function(data) {
                if (reloadIcon) reloadIcon.classList.remove('animate-spin');
                if (loadingState) loadingState.classList.add('hidden');

                if (Array.isArray(data) && data.length > 0) {
                    allStudents = data;
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
                    populateClassDropdown();
                    applyFilters();
                }
            };

            const script = document.createElement('script');
            script.id = 'jsonp_script';
            script.src = APPS_SCRIPT_URL + "?callback=handleSheetData&t=" + new Date().getTime();
            script.onerror = function() {
                if (reloadIcon) reloadIcon.classList.remove('animate-spin');
                if (loadingState) loadingState.classList.add('hidden');
            };
            document.body.appendChild(script);
        }

        function populateClassDropdown() {
            const classSelect = document.getElementById('classFilter');
            const currentSelected = classSelect.value;
            const classes = [...new Set(allStudents.map(s => s.lop))].filter(Boolean).sort();
            
            let html = '<option value="">-- Tất cả các lớp --</option>';
            classes.forEach(c => {
                html += `<option value="${c}" ${c === currentSelected ? 'selected' : ''}>Lớp ${c}</option>`;
            });
            classSelect.innerHTML = html;
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedClass = document.getElementById('classFilter').value;
            const selectedStatus = document.getElementById('statusFilter').value;

            filteredStudents = allStudents.filter(s => {
                const matchesSearch = !search || String(s.hoTen).toLowerCase().includes(search) || String(s.maHS).includes(search);
                const matchesClass = !selectedClass || s.lop === selectedClass;
                
                let matchesStatus = true;
                if (selectedStatus === 'Đúng giờ') matchesStatus = (s.trangThai === 'Đúng giờ');
                else if (selectedStatus === 'Trễ') matchesStatus = (s.trangThai === 'Trễ');
                else if (selectedStatus === 'P') matchesStatus = (s.trangThai === 'P' || s.trangThai === 'p');
                else if (selectedStatus === 'KP') matchesStatus = (s.trangThai === 'KP' || !s.trangThai);

                return matchesSearch && matchesClass && matchesStatus;
            });

            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('studentTableBody');
            const emptyState = document.getElementById('emptyState');

            if (filteredStudents.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            filteredStudents.forEach((s, idx) => {
                let badgeStyle = "bg-rose-50 text-rose-700 border-rose-200";
                let statusText = "Không Phép (KP)";

                const st = String(s.trangThai).toUpperCase();
                if (st === 'ĐÚNG GIỜ') {
                    badgeStyle = "bg-emerald-50 text-emerald-700 border-emerald-200";
                    statusText = "Đúng giờ";
                } else if (st === 'TRỄ') {
                    badgeStyle = "bg-amber-50 text-amber-700 border-amber-200";
                    statusText = "Đi trễ";
                } else if (st === 'P') {
                    badgeStyle = "bg-sky-50 text-sky-700 border-sky-200";
                    statusText = "Có phép (P)";
                }

                html += `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="py-3 px-4 text-center font-medium text-slate-400">${idx + 1}</td>
                        <td class="py-3 px-4 font-semibold text-slate-800">${s.hoTen}</td>
                        <td class="py-3 px-4 text-center"><span class="px-2 py-0.5 bg-slate-100 font-medium text-xs text-slate-600 rounded">${s.lop}</span></td>
                        <td class="py-3 px-4 text-center font-mono text-xs text-slate-500">${s.maHS}</td>
                        <td class="py-3 px-4 text-center font-mono text-xs text-slate-500">${s.thoiGian || '--:--:--'}</td>
                        <td class="py-3 px-4 text-center">
                            <span class="inline-block px-3 py-1 text-xs font-semibold rounded-full border ${badgeStyle}">
                                ${statusText}
                            </span>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        window.addEventListener('DOMContentLoaded', () => fetchData(false));
    </script>
</body>
</html>
