<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Điểm Danh Trực Tuyến - THPT Vị Thanh</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen p-4 md:p-6 font-sans">
    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
      
      <!-- HEADER -->
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-100 pb-5 mb-6 gap-4">
        <div class="flex items-center gap-4">
          <div class="w-14 h-14 bg-green-50 rounded-xl flex items-center justify-center border border-green-100 p-2">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-gray-800">Quản Lý Điểm Danh Trực Tuyến</h1>
            <p class="text-sm text-gray-500">Trường THPT Vị Thanh • Hiển thị: <span id="count-display" class="font-semibold text-blue-600">0 / 0</span> học sinh</p>
            <div class="flex items-center gap-2 mt-1 text-xs text-gray-400">
              <span class="inline-block w-2 h-2 rounded-full bg-green-500"></span>
              <span>Đồng bộ từ Google Sheets API</span>
              <span>•</span>
              <span>Cập nhật: <span id="update-time">--:--:--</span></span>
            </div>
          </div>
        </div>
        
        <div class="flex flex-wrap gap-2">
          <button onclick="loadData()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 shadow-sm">
            🔄 Tải lại dữ liệu
          </button>
        </div>
      </div>

      <!-- STATS CARDS -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-blue-50/50 border border-blue-100 p-4 rounded-xl">
          <p class="text-xs font-semibold text-gray-500 uppercase">Có mặt / Đúng giờ</p>
          <p id="stat-dung-gio" class="text-2xl font-bold text-blue-600 mt-1">0</p>
        </div>
        <div class="bg-yellow-50/50 border border-yellow-100 p-4 rounded-xl">
          <p class="text-xs font-semibold text-gray-500 uppercase">Đi trễ</p>
          <p id="stat-di-tre" class="text-2xl font-bold text-yellow-600 mt-1">0</p>
        </div>
        <div class="bg-red-50/50 border border-red-100 p-4 rounded-xl">
          <p class="text-xs font-semibold text-gray-500 uppercase">Vắng / Khác</p>
          <p id="stat-vang" class="text-2xl font-bold text-red-600 mt-1">0</p>
        </div>
        <div class="bg-green-50/50 border border-green-100 p-4 rounded-xl col-span-2 md:col-span-1">
          <p class="text-xs font-semibold text-gray-500 uppercase">Tổng số</p>
          <p id="stat-tong" class="text-2xl font-bold text-green-600 mt-1">0</p>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="relative">
          <input type="text" id="search-input" onkeyup="filterData()" placeholder="Tìm kiếm theo tên, mã HS..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
          <svg class="w-4 h-4 text-gray-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <div>
          <select id="filter-class" onchange="filterData()" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-gray-600">
            <option value="">-- Tất cả các lớp --</option>
          </select>
        </div>
        <div>
          <select id="filter-status" onchange="filterData()" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-gray-600">
            <option value="">-- Tất cả trạng thái --</option>
            <option value="Có mặt">Có mặt</option>
            <option value="Đi trễ">Đi trễ</option>
          </select>
        </div>
      </div>

      <!-- TABLE -->
      <div class="overflow-x-auto rounded-xl border border-gray-100">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50/70 border-b border-gray-100 text-xs uppercase text-gray-500 tracking-wider">
              <th class="py-3 px-4 font-semibold w-16">STT</th>
              <th class="py-3 px-4 font-semibold">Họ và Tên</th>
              <th class="py-3 px-4 font-semibold w-28">Lớp</th>
              <th class="py-3 px-4 font-semibold w-36">Mã HS</th>
              <th class="py-3 px-4 font-semibold w-48">Thời Gian</th>
              <th class="py-3 px-4 font-semibold w-36 text-center">Trạng Thái</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-gray-100 text-sm text-gray-700">
            <tr>
              <td colspan="6" class="text-center py-8 text-gray-400">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <script>
      // THAY ĐƯỜNG DẪN WEB APP /exec CỦA BẠN VÀO ĐÂY
      const GAS_API_URL = "URL_WEB_APP_CỦA_BẠN";

      let globalData = [];

      function loadData() {
        document.getElementById('update-time').innerText = new Date().toLocaleTimeString();
        document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">Đang kết nối tới Google Sheets...</td></tr>';

        fetch(GAS_API_URL)
          .then(response => response.json())
          .then(data => {
            onDataLoaded(data);
          })
          .catch(error => {
            console.error("Lỗi:", error);
            document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-red-500">Lỗi kết nối dữ liệu!</td></tr>';
          });
      }

      window.onload = function() {
        loadData();
      };

      function onDataLoaded(data) {
        if (!data || data.length <= 1) {
          document.getElementById('table-body').innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">Sheet Data hiện chưa có dữ liệu học sinh.</td></tr>';
          return;
        }

        globalData = data.slice(1);
        populateClassDropdown(globalData);
        updateStats(globalData);
        renderTable(globalData);
      }

      function populateClassDropdown(data) {
        const classes = [...new Set(data.map(row => row[2]).filter(Boolean))].sort();
        const select = document.getElementById('filter-class');
        select.innerHTML = '<option value="">-- Tất cả các lớp --</option>';
        classes.forEach(cls => {
          select.innerHTML += `<option value="${cls}">${cls}</option>`;
        });
      }

      function updateStats(data) {
        const total = data.length;
        let dungGio = 0, diTre = 0, vang = 0;

        data.forEach(row => {
          let status = String(row[5] || '').toLowerCase();
          if (status.includes('có mặt')) dungGio++;
          else if (status.includes('trễ')) diTre++;
          else vang++;
        });

        document.getElementById('stat-dung-gio').innerText = dungGio;
        document.getElementById('stat-di-tre').innerText = diTre;
        document.getElementById('stat-vang').innerText = vang;
        document.getElementById('stat-tong').innerText = total;
        document.getElementById('count-display').innerText = `${total} / ${total}`;
      }

      function renderTable(data) {
        const tbody = document.getElementById('table-body');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-gray-400">Không tìm thấy dữ liệu học sinh phù hợp.</td></tr>';
          return;
        }

        let html = '';
        data.forEach((row, index) => {
          let maHS = row[0] || '';
          let hoTen = row[1] || '';
          let lop = row[2] || '';
          let ngay = row[3] || '';
          let gio = row[4] || '';
          let trangThai = row[5] || 'Chưa cập nhật';
          let thoiGian = (ngay || gio) ? `${gio} - ${ngay}` : '---';

          let badgeColor = 'bg-blue-50 text-blue-700 border-blue-100';
          let stLower = trangThai.toLowerCase();
          if (stLower.includes('trễ')) badgeColor = 'bg-yellow-50 text-yellow-700 border-yellow-100';
          if (stLower.includes('vắng')) badgeColor = 'bg-red-50 text-red-700 border-red-100';

          html += `
            <tr class="hover:bg-gray-50/50 transition-colors">
              <td class="py-3 px-4 text-gray-400 font-medium">${index + 1}</td>
              <td class="py-3 px-4 font-semibold text-gray-800 uppercase">${hoTen}</td>
              <td class="py-3 px-4"><span class="px-2.5 py-1 bg-gray-100 text-gray-700 rounded-md text-xs font-semibold">${lop}</span></td>
              <td class="py-3 px-4 text-gray-600 font-mono text-xs">${maHS}</td>
              <td class="py-3 px-4 text-gray-500 text-xs">${thoiGian}</td>
              <td class="py-3 px-4 text-center">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold border ${badgeColor}">${trangThai}</span>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }

      function filterData() {
        const keyword = document.getElementById('search-input').value.toLowerCase();
        const selectedClass = document.getElementById('filter-class').value;
        const selectedStatus = document.getElementById('filter-status').value;

        const filtered = globalData.filter(row => {
          let maHS = String(row[0] || '').toLowerCase();
          let hoTen = String(row[1] || '').toLowerCase();
          let lop = String(row[2] || '');
          let trangThai = String(row[5] || '');

          let matchKeyword = hoTen.includes(keyword) || maHS.includes(keyword);
          let matchClass = !selectedClass || lop === selectedClass;
          let matchStatus = !selectedStatus || trangThai.includes(selectedStatus);

          return matchKeyword && matchClass && matchStatus;
        });

        renderTable(filtered);
        document.getElementById('count-display').innerText = `${filtered.length} / ${globalData.length}`;
      }
    </script>
  </body>
</html>
